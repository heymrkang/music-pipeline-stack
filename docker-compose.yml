services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "1m"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /mnt/storage/music-pipeline/config/navidrome
        target: /data
      - type: bind
        source: /mnt/storage/music-pipeline/media/library
        target: /music
        read_only: true
    expose:
      - "4533"

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /state
      TEMP_DIR: /downloads/.tmp
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /mnt/storage/music-pipeline/media/downloads-raw
        target: /downloads
      - type: bind
        source: /mnt/storage/music-pipeline/config/metube
        target: /state
    expose:
      - "8081"

  music-tag-web:
    image: xhongc/music_tag_web:latest
    restart: unless-stopped
    command: /start
    volumes:
      - type: bind
        source: /mnt/storage/music-pipeline/media/staging
        target: /app/media
      - type: bind
        source: /mnt/storage/music-pipeline/config/music-tag-web
        target: /app/data
    expose:
      - "8001"

  postprocess-worker:
    image: ghcr.io/heymrkang/music-pipeline-stack:latest
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      RAW_DIR: /media/downloads-raw
      STAGING_DIR: /media/staging
      FAILED_DIR: /media/failed
      SCAN_INTERVAL_SECONDS: "20"
      STABLE_SECONDS: "20"
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /mnt/storage/music-pipeline/media
        target: /media

  publisher-ui:
    image: ghcr.io/heymrkang/music-pipeline-stack:latest
    restart: unless-stopped
    command: ["node", "src/publisher.js"]
    environment:
      PORT: "8080"
      STAGING_DIR: /media/staging
      LIBRARY_DIR: /media/library
      REQUIRE_ALBUM: "false"
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: /mnt/storage/music-pipeline/media
        target: /media
    expose:
      - "8080"
